name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog
    uses: ./.github/workflows/trufflehog.yml
    with:
      source_sha: ${{ github.sha }}

  lint:
    name: Lint
    uses: ./.github/workflows/linting.yml
    with:
      source_sha: ${{ github.sha }}

  tests:
    name: Tests
    needs: [trufflehog, lint]
    uses: ./.github/workflows/tests.yml
    with:
      source_sha: ${{ github.sha }}
    secrets:
      HF_TOKEN: ${{ github.event_name == 'push' && secrets.HF_TOKEN || '' }}

  build_main:
    name: Build main
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      push: true
      source_sha: ${{ github.sha }}

  approve_pr_build:
    name: Approve PR build
    needs: tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: pr-build
    steps:
      - run: echo "PR build approved"

  build_pr:
    name: Build PR
    needs: approve_pr_build
    permissions:
      actions: write
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      push: true
      source_sha: ${{ github.sha }}

  push:
    name: Push
    needs: [tests, build_main]
    if: >-
      always() &&
      needs.tests.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
      (github.ref_type == 'tag' || needs.build_main.result == 'success')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/push.yml
    with:
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      source_sha: ${{ github.sha }}

  publish:
    name: Publish
    needs: tests
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/publish.yml
    with:
      sha: ${{ github.sha }}
      tag: ${{ github.ref_name }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
