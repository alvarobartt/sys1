name: Publish

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that passed linting and tests
        required: true
        type: string
      sha:
        description: Tested commit to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Verify tested release
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            v*) ;;
            *) exit 1 ;;
          esac
          test "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" = "${RELEASE_SHA}"
          crate_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sys1") | .version')"
          test "${RELEASE_TAG}" = "v${crate_version}"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
