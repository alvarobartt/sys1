name: Lint

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: lint-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: lint-v2-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --locked --no-default-features --features cpu --all-targets -- -D warnings
