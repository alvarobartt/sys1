name: Build

on:
  workflow_call:
    inputs:
      push:
        required: true
        type: boolean
      source_sha:
        required: true
        type: string

jobs:
  build:
    name: ${{ matrix.name }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            file: Dockerfile
            staging_suffix: -cpu-amd64
            cache_scope: cpu-amd64
            build_args: ""
            platform: linux/amd64
            runner: ubuntu-latest
          - name: cpu
            file: Dockerfile
            staging_suffix: -cpu-arm64
            cache_scope: cpu-arm64
            build_args: ""
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - name: turing
            file: Dockerfile.cuda
            staging_suffix: -turing-amd64
            cache_scope: cuda-turing
            build_args: CUDA_COMPUTE_CAPS=75
            platform: linux/amd64
            runner: ubuntu-latest
          - name: ampere
            file: Dockerfile.cuda
            staging_suffix: -ampere-amd64
            cache_scope: cuda-ampere
            build_args: CUDA_COMPUTE_CAPS=80;86
            platform: linux/amd64
            runner: ubuntu-latest
          - name: ada-lovelace
            file: Dockerfile.cuda
            staging_suffix: -ada-lovelace-amd64
            cache_scope: cuda-ada-lovelace
            build_args: CUDA_COMPUTE_CAPS=89
            platform: linux/amd64
            runner: ubuntu-latest
          - name: hopper
            file: Dockerfile.cuda
            staging_suffix: -hopper-amd64
            cache_scope: cuda-hopper
            build_args: CUDA_COMPUTE_CAPS=90
            platform: linux/amd64
            runner: ubuntu-latest
          - name: blackwell
            file: Dockerfile.cuda
            staging_suffix: -blackwell-amd64
            cache_scope: cuda-blackwell-amd64
            build_args: CUDA_COMPUTE_CAPS=100;120
            platform: linux/amd64
            runner: ubuntu-latest
          - name: blackwell
            file: Dockerfile.cuda
            staging_suffix: -blackwell-arm64
            cache_scope: cuda-blackwell-arm64
            build_args: CUDA_COMPUTE_CAPS=121
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
      - name: Free disk space for CUDA
        if: matrix.name != 'cpu'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          swap-storage: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Configure sccache credentials
        if: inputs.push
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.source_sha }}${{ matrix.staging_suffix }}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: runtime
          build-args: |
            ${{ matrix.build_args }}
            SCCACHE_GHA_ENABLED=${{ inputs.push && 'on' || 'off' }}
          secrets: |
            ACTIONS_RESULTS_URL=${{ env.ACTIONS_RESULTS_URL }}
            ACTIONS_RUNTIME_TOKEN=${{ env.ACTIONS_RUNTIME_TOKEN }}
          platforms: ${{ matrix.platform }}
          push: ${{ inputs.push }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: ${{ matrix.name == 'cpu' && format('type=gha,scope={0}', matrix.cache_scope) || format('type=registry,ref=ghcr.io/{0}:buildcache-{1}', github.repository, matrix.cache_scope) }}
          cache-to: ${{ matrix.name == 'cpu' && format('type=gha,mode=max,scope={0}', matrix.cache_scope) || (inputs.push && format('type=registry,ref=ghcr.io/{0}:buildcache-{1},mode=max', github.repository, matrix.cache_scope) || '') }}
