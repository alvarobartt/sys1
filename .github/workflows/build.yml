name: Build containers

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            file: Dockerfile
            suffix: -cpu
            cache_mode: max
          - name: cuda
            file: Dockerfile.cuda
            suffix: -cuda
            cache_mode: min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space for CUDA
        if: matrix.name == 'cuda'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          preinstalled-runtimes: false
          swap-storage: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=,suffix=${{ matrix.suffix }},priority=300
            type=sha,format=short,prefix=,priority=300,enable=${{ matrix.name == 'cpu' }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ matrix.name == 'cpu' && github.event_name != 'pull_request' }}
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=${{ matrix.cache_mode }},scope=${{ matrix.name }}

  promote:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            suffix: -cpu
          - name: cuda
            suffix: -cuda
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=semver,pattern={{version}},enable=${{ matrix.name == 'cpu' }}
            type=raw,value=latest${{ matrix.suffix }}
            type=raw,value=latest,enable=${{ matrix.name == 'cpu' }}
      - name: Promote ${{ matrix.name }} image
        env:
          DESTINATION_TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail

          source_tag="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA:0:7}${{ matrix.suffix }}"
          source_digest=""

          for attempt in {1..60}; do
            if source_digest="$(docker buildx imagetools inspect "${source_tag}" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest')" \
              && [[ "${source_digest}" == sha256:* ]]; then
              break
            fi

            if [[ "${attempt}" -eq 60 ]]; then
              echo "Source image ${source_tag} was not published within 20 minutes" >&2
              exit 1
            fi

            echo "Waiting for ${source_tag} to be published (attempt ${attempt}/60)"
            sleep 20
          done

          immutable_source="ghcr.io/${GITHUB_REPOSITORY}@${source_digest}"
          create_args=()
          while IFS= read -r destination_tag; do
            if [[ -n "${destination_tag}" ]]; then
              create_args+=(--tag "${destination_tag}")
            fi
          done <<< "${DESTINATION_TAGS}"

          docker buildx imagetools create "${create_args[@]}" "${immutable_source}"

          while IFS= read -r destination_tag; do
            if [[ -z "${destination_tag}" ]]; then
              continue
            fi

            destination_digest="$(docker buildx imagetools inspect "${destination_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [[ "${destination_digest}" != "${source_digest}" ]]; then
              echo "Digest mismatch for ${destination_tag}: expected ${source_digest}, got ${destination_digest}" >&2
              exit 1
            fi
          done <<< "${DESTINATION_TAGS}"
